
name: F&O Contract Changes Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1-5"

permissions:
  contents: write

jobs:
  monitor-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run F&O contract changes monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.FoList_Bot }}
          TELEGRAM_CHAT_ID: "8430921727"
        run: python fo_contract_changes.py
