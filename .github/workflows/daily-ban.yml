
name: Daily NSE F&O Ban Monitor

on:
  schedule:
       - cron: "35 7 * * 1-5"
  workflow_dispatch:

jobs:
  send-ban-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch NSE ban list and send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.FoList_Bot }}
        run: python bot.py
