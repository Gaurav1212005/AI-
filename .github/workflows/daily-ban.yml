name: Daily NSE F&O Ban Monitor

on:
  schedule:
    # 3:00 AM IST (Mon-Fri) = 9:30 PM UTC (Sun-Thu)
    - cron: "30 21 * * 0-4"
  workflow_dispatch:

jobs:
  send-ban-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch NSE ban list and send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.FoList_Bot }}
        run: python bot.py
