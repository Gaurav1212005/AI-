
name: Test Corporate Actions Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-nse-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test NSE corporate actions
        run: python corporate_actions.py
