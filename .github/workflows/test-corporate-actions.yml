
name: Corporate Actions Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "52 3 * * *"

permissions:
  contents: read

jobs:
  corporate-actions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run corporate actions monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.FoList_Bot }}
          TELEGRAM_CHAT_ID: "8430921727"
        run: python corporate_actions.py
