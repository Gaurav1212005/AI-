name: F&O Contract Changes Monitor
on:
  schedule:
    # 3:00 AM IST (Mon-Fri) = 9:30 PM UTC (Sun-Thu)
    - cron: "30 21 * * 0-4"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Display start time
        run: |
          echo "UTC time:"
          date -u
          echo "Kolkata time:"
          TZ=Asia/Kolkata date
      - name: Run F&O contract monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.FoList_Bot }}
          TELEGRAM_CHAT_ID: "8430921727"
          TZ: Asia/Kolkata
        run: python -u fo_contract_changes.py
      - name: Commit updated snapshot
        if: success()
        run: |
          if git diff --quiet -- fo_contract_snapshot.json; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fo_contract_snapshot.json
          git commit -m "Update F&O contract snapshot"
          git push
      - name: Display completion time
        if: always()
        run: |
          echo "Workflow completed."
          echo "UTC time:"
          date -u
          echo "Kolkata time:"
          TZ=Asia/Kolkata date
