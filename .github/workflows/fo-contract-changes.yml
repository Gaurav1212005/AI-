name: F&O Contract Changes Monitor

on:
  schedule:
    - cron: "0 4 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Display workflow start time
        run: |
          echo "=================================="
          echo "Workflow started"
          echo "=================================="
          echo "UTC time:"
          date -u
          echo "Indian Standard Time:"
          TZ=Asia/Kolkata date
          echo "=================================="

      - name: Run F&O contract monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.FoList_Bot }}
          TELEGRAM_CHAT_ID: "8430921727"
        run: |
          echo "Starting F&O contract monitor..."
          echo "Start time (IST):"
          TZ=Asia/Kolkata date

          python -u fo_contract_changes.py

          echo "F&O contract monitor finished."
          echo "Finish time (IST):"
          TZ=Asia/Kolkata date

      - name: Commit updated snapshot
        if: success()
        run: |
          if git diff --quiet -- fo_contract_snapshot.json; then
            echo "Snapshot unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fo_contract_snapshot.json
          git commit -m "Update F&O contract snapshot"
          git push

      - name: Display workflow completion time
        if: always()
        run: |
          echo "=================================="
          echo "Workflow execution completed"
          echo "Completion time (UTC):"
          date -u
          echo "Completion time (IST):"
          TZ=Asia/Kolkata date
          echo "=================================="
